<span class="section-eyebrow"><i class="bi bi-people"></i>Clients</span>
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h5 class="fw-bold mb-0">All registered clients</h5>
  <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addClientModal">
    <i class="bi bi-person-plus-fill me-1"></i>Add Client
  </button>
</div>
<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Username</th><th>Role</th><th></th></tr></thead>
    <tbody id="clientsBody"></tbody>
  </table>
</div>

<!-- Add Client Modal -->
<div class="modal fade" id="addClientModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="addClientForm">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-person-plus-fill me-2"></i>Add Client</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="addClientAlert" class="alert alert-danger d-none"></div>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">First Name</label>
              <input name="first_name" class="form-control" required>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Last Name</label>
              <input name="last_name" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <input name="address" class="form-control" required>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Phone</label>
              <input name="phone" class="form-control" inputmode="numeric" maxlength="10" required>
              <div id="addClientPhoneFeedback" class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Gender</label>
              <select name="gender" class="form-select" required>
                <option value="">Select…</option>
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="setCredentialsCheck">
                <label class="form-check-label" for="setCredentialsCheck">
                  Set up login credentials now
                </label>
                <div class="form-text">Leave unchecked to skip — an account is still created automatically, and the client can log in later once you set a password via "Forgot Password" on the login page.</div>
              </div>
            </div>
            <div class="col-12 col-md-6 d-none" id="usernameField">
              <label class="form-label">Username</label>
              <input name="username" class="form-control">
            </div>
            <div class="col-12 col-md-6 d-none" id="passwordField">
              <label class="form-label">Password</label>
              <input name="password" type="password" class="form-control">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="addClientSubmit"><i class="bi bi-check2-circle me-1"></i>Add Client</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadClients() {
  const tbody = document.getElementById('clientsBody');
  try {
    const r = await fetch('/lazio_site/admin/api/clients.php?action=list', {credentials:'include'});
    if (!r.ok) {
      const msg = r.status === 403 ? 'Access denied. Please log in as admin to view clients.' : 'Failed to load clients.';
      tbody.innerHTML = `<tr><td colspan="6" class="text-muted small">${msg}</td></tr>`;
      return;
    }
    const data = await r.json();
    if (!data.items || data.items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-muted small">No clients yet.</td></tr>';
      return;
    }
    tbody.innerHTML = data.items.map(c => `
      <tr>
        <td>${c.id}</td>
        <td>${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}</td>
        <td>${escapeHtml(c.phone)}</td>
        <td>${escapeHtml(c.username || '-')}</td>
        <td>${escapeHtml(c.role || '-')}</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" href="/lazio_site/client/index.php?client_id=${c.id}" data-client="${c.id}">View Invoices</a>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-muted small">Network error loading clients.</td></tr>';
  }
}

document.getElementById('setCredentialsCheck').addEventListener('change', (e) => {
  document.getElementById('usernameField').classList.toggle('d-none', !e.target.checked);
  document.getElementById('passwordField').classList.toggle('d-none', !e.target.checked);
});

const addClientPhoneInput = document.querySelector('#addClientForm input[name="phone"]');
const addClientPhoneFeedback = document.getElementById('addClientPhoneFeedback');

function validateAddClientPhone() {
  const original = addClientPhoneInput.value;
  const filtered = original.replace(/\D/g, '').slice(0, 10);
  if (original !== filtered) addClientPhoneInput.value = filtered;

  if (filtered.length === 0) {
    addClientPhoneFeedback.textContent = '';
    addClientPhoneInput.classList.remove('is-invalid');
    return false;
  }
  if (original.replace(/\D/g, '') !== original) {
    addClientPhoneFeedback.textContent = 'Please enter numbers only (0-9).';
    addClientPhoneInput.classList.add('is-invalid');
    return false;
  }
  if (filtered.length !== 10) {
    addClientPhoneFeedback.textContent = 'Phone must be exactly 10 digits.';
    addClientPhoneInput.classList.add('is-invalid');
    return false;
  }
  addClientPhoneFeedback.textContent = '';
  addClientPhoneInput.classList.remove('is-invalid');
  return true;
}

addClientPhoneInput.addEventListener('input', validateAddClientPhone);

document.getElementById('addClientForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('addClientAlert');
  alertBox.classList.add('d-none');

  if (!/^\d{10}$/.test(addClientPhoneInput.value.trim())) {
    validateAddClientPhone();
    addClientPhoneFeedback.textContent = 'Phone must be exactly 10 digits.';
    addClientPhoneInput.classList.add('is-invalid');
    alertBox.textContent = 'Phone must be exactly 10 digits.';
    alertBox.classList.remove('d-none');
    return;
  }

  const form = new FormData(e.target);
  const data = Object.fromEntries(form.entries());
  data.set_credentials = document.getElementById('setCredentialsCheck').checked;

  const submitBtn = document.getElementById('addClientSubmit');
  submitBtn.disabled = true;
  try {
    const r = await fetch('/lazio_site/admin/api/clients.php?action=create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',
      body: JSON.stringify(data)
    });
    const res = await r.json();
    if (!res.ok) {
      alertBox.textContent = res.message || 'Failed to add client.';
      alertBox.classList.remove('d-none');
      return;
    }
    bootstrap.Modal.getInstance(document.getElementById('addClientModal')).hide();
    e.target.reset();
    document.getElementById('usernameField').classList.add('d-none');
    document.getElementById('passwordField').classList.add('d-none');
    if (res.generated_password) {
      alert(`Client added. An account was auto-generated:\n\nUsername: ${res.username}\nPassword: ${res.generated_password}\n\nShare these with the client so they can log in.`);
    }
    loadClients();
  } catch (err) {
    alertBox.textContent = 'Network error. Please try again.';
    alertBox.classList.remove('d-none');
  } finally {
    submitBtn.disabled = false;
  }
});

loadClients();
</script>
