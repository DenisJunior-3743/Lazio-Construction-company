
<span class="section-eyebrow"><i class="bi bi-graph-up"></i>Overview</span>
<h5 class="fw-bold mb-3">Business at a glance</h5>
<div class="row g-3">
  <div class="col-6 col-md-3"><div class="stat"><span class="stat-icon"><i class="bi bi-people"></i></span><div class="small-muted">Clients</div><div id="statClients" class="fs-4">—</div></div></div>
  <div class="col-6 col-md-3"><div class="stat"><span class="stat-icon"><i class="bi bi-receipt"></i></span><div class="small-muted">Invoices</div><div id="statInvoices" class="fs-4">—</div></div></div>
  <div class="col-6 col-md-3"><div class="stat"><span class="stat-icon"><i class="bi bi-box-seam"></i></span><div class="small-muted">Items</div><div id="statItems" class="fs-4">—</div></div></div>
  <div class="col-6 col-md-3"><div class="stat"><span class="stat-icon"><i class="bi bi-cloud-upload"></i></span><div class="small-muted">Uploads</div><div id="statUploads" class="fs-4">—</div></div></div>
  <div class="col-6 col-md-3"><div class="stat"><span class="stat-icon"><i class="bi bi-mortarboard"></i></span><div class="small-muted">Interns</div><div id="statInterns" class="fs-4">—</div></div></div>
  <div class="col-6 col-md-3"><div class="stat"><span class="stat-icon"><i class="bi bi-hourglass-split"></i></span><div class="small-muted">Pending applications</div><div id="statPendingApps" class="fs-4">—</div></div></div>
</div>
<script>
(async () => {
  const ids = {clients:'statClients', invoices:'statInvoices', items:'statItems', uploads:'statUploads', interns:'statInterns', pending_applications:'statPendingApps'};
  const setAll = (v) => Object.values(ids).forEach(id => { document.getElementById(id).textContent = v; });
  try {
    const r = await fetch('/lazio_site/admin/api/stats.php', {credentials:'include'});
    if (!r.ok) { setAll('—'); return; }
    const s = await r.json();
    Object.entries(ids).forEach(([key, id]) => { document.getElementById(id).textContent = s[key] ?? '—'; });
  } catch (e) {
    setAll('—');
  }
})();
</script>
